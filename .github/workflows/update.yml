name: Update Resin Subscription

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions uses UTC.
    # Runs every 8 hours: 00:00, 08:00, 16:00 UTC.
    - cron: "0 */8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Resin subscription
        run: python build.py

      - name: Commit updated subscription
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/resin.txt

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update Resin subscription"
          git push
